[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-optimizacion-mat"
version = "0.1.4"
description = "Backtest compuesto BTC/ETH (futuros USDT) con ventanas deslizantes, funding y optimización de señales opcional."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["backtest", "quantitative-finance", "binance", "futures", "monte-carlo", "optimization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24,<3",
  "requests>=2.28.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pre-commit>=4,<5"]

[project.urls]
Homepage = "https://github.com/emilianob-ux/SISTEMA-OPTIMIZACION-MAT"
Documentation = "https://github.com/emilianob-ux/SISTEMA-OPTIMIZACION-MAT/blob/main/docs/tutorial_quickstart.md"
Repository = "https://github.com/emilianob-ux/SISTEMA-OPTIMIZACION-MAT"
Issues = "https://github.com/emilianob-ux/SISTEMA-OPTIMIZACION-MAT/issues"

[tool.setuptools]
py-modules = ["compound_optimize_runner", "leverage_pi"]

[tool.setuptools.packages.find]
where = ["."]
include = ["features*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Estilo compacto heredado del runner principal; migración gradual posible.
"compound_optimize_runner.py" = ["E701", "E702"]
