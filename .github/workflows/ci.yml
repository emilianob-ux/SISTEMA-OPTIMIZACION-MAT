name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Synthetic dataset
        run: python scripts/bootstrap_synthetic_candles_db.py

      - name: Unit tests
        run: pytest tests/ -q

      - name: Smoke runner (JSON válido)
        run: |
          python compound_optimize_runner.py --db data/synthetic_signal_tune.db --holdout-frac 0 \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'p_win_terminal' in d and 'p_ruin' in d"

      - name: Compile check
        run: python -m compileall -q compound_optimize_runner.py leverage_pi.py features scripts
