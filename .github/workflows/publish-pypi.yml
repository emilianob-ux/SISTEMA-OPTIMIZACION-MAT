# Publica el paquete a PyPI cuando publicás un Release en GitHub.
# Requisito: Trusted Publisher configurado en PyPI para este repo + workflow.
# Ver: https://docs.pypi.org/trusted-publishers/

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Branch o tag a construir (ej. main o v0.3.0)"
        required: false
        default: "v0.3.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/decision-resilience-engine
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name != 'workflow_dispatch' && github.sha || github.event.inputs.git_ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
